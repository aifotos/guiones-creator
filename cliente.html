<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Tus guiones · aifotos</title>
  <link rel="icon" href="assets/logo-aifotos.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/marca.css?v=202610161628">
  <link rel="stylesheet" href="css/impresion.css?v=202610161628">
  <link rel="stylesheet" href="css/app.css?v=202610161628">
  <link rel="stylesheet" href="css/cliente.css?v=202610161628">
</head>
<body class="pagina-cliente">
  <main class="vc" id="vc">
    <p class="cliente-estado" id="estado">Cargando tus guiones…</p>

    <nav class="cliente-lista" id="lista" hidden aria-label="Tus guiones"></nav>

    <div class="vc-columna" id="guion" hidden>
      <button class="vc-volver" id="volver" hidden>← Todos tus guiones</button>
      <div class="vc-fila">
        <img src="assets/logo-aifotos.png" alt="aifotos">
        <span class="vc-guardado guardado" id="guardado" aria-live="polite"></span>
        <span class="estado-guion" id="estado-guion"></span>
      </div>
      <div class="vc-saludo">
        <h1 id="saludo-titulo">Hola.</h1>
        <p id="saludo-texto"></p>
      </div>
      <article class="lectura vc-hoja" id="lectura"></article>
      <div class="vc-espacio"></div>
    </div>
  </main>

  <div class="vc-barra" id="acciones" hidden>
    <button class="vc-editar" id="editar"><svg class="ico" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="stroke-width:2.75"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg><span>Editar</span></button>
    <button class="vc-icono" id="descartar" hidden aria-label="Descartar cambios" title="Descartar cambios"><svg class="ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="stroke-width:2.75"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <button class="vc-icono" id="cliente-teleprompter" aria-label="Teleprompter" title="Teleprompter"><svg class="ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="stroke-width:2.75"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
    <button class="vc-icono" id="cliente-pdf" aria-label="PDF" title="Descargar en PDF"><svg class="ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="stroke-width:2.75"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
    <button class="vc-icono" id="chat-abrir" aria-label="Chat" title="Chat con aifotos"><svg class="ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="stroke-width:2.75"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span class="vc-sin-leer" id="sin-leer" hidden></span></button>
    <button class="vc-aprobar" id="aprobar"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg><span>Aprobar</span></button>
  </div>

  <aside class="chat-panel" id="chat" aria-label="Chat con aifotos">
    <div class="chat-cabecera">
      <button class="chat-cerrar" id="chat-cerrar" aria-label="Cerrar chat"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="stroke-width:2.75"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <span class="avatar chat-avatar chat-avatar-aifotos" aria-hidden="true">ai</span>
      <div class="chat-quien">
        <span class="chat-nombre">aifotos</span>
        <span class="chat-sub">Escríbenos sobre este guión</span>
      </div>
    </div>
    <ul class="chat-mensajes" id="comentarios-lista"></ul>
    <div class="chat-pie">
      <div class="chat-cita-pendiente" id="chat-cita" hidden><span id="chat-cita-texto"></span><button type="button" id="chat-cita-quitar" aria-label="Quitar cita">✕</button></div>
      <form class="chat-escribir" id="form-comentario">
        <textarea id="comentario-texto" rows="1" placeholder="Escríbele a aifotos…" aria-label="Mensaje"></textarea>
        <button class="chat-enviar" id="comentario-enviar" aria-label="Enviar"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="stroke-width:2.75"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
      </form>
    </div>
  </aside>

  <button class="burbuja-seleccion" id="burbuja" hidden>
    <svg class="ico" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="stroke-width:2.75"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
    Comentar esta frase
  </button>

  <dialog class="dialogo dialogo-pregunta" id="dialogo-pregunta">
    <form method="dialog" class="dialogo-contenido">
      <p id="pregunta-texto"></p>
      <div class="dialogo-acciones">
        <button class="boton" value="no" id="pregunta-no">Cancelar</button>
        <button class="boton boton-principal" value="si" id="pregunta-si">Sí</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialogo dialogo-whatsapp" id="dialogo-whatsapp">
    <form method="dialog" class="dialogo-contenido" id="form-whatsapp">
      <div class="whatsapp-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3zm0 1.6a7.4 7.4 0 1 1-3.8 13.8l-.3-.2-2.7.7.7-2.6-.2-.3A7.4 7.4 0 0 1 12 4.6zm-3 3.6c-.2 0-.5 0-.7.3-.3.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 4.9 4.2 2.4.9 2.9.8 3.4.7.5 0 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4l-.5-.3-1.8-.9c-.3-.1-.5-.1-.7.2l-.8 1c-.2.2-.3.2-.6.1-.3-.2-1.1-.4-2.1-1.3-.8-.7-1.3-1.5-1.5-1.8-.2-.3 0-.4.1-.6l.4-.5.3-.5v-.5l-.8-2c-.2-.5-.4-.5-.6-.5H9z"/></svg>
      </div>
      <h2>¿A qué WhatsApp te avisamos?</h2>
      <p class="dialogo-ayuda">Cuando aifotos te escriba o tenga una versión nueva de tu guión, te avisará por WhatsApp. Solo te lo pedimos una vez.</p>
      <div class="whatsapp-numero">
        <select id="whatsapp-pais" aria-label="Código de país">
          <option value="1">🇩🇴 +1</option>
          <option value="1">🇺🇸 +1</option>
          <option value="1">🇵🇷 +1</option>
          <option value="34">🇪🇸 +34</option>
          <option value="52">🇲🇽 +52</option>
          <option value="57">🇨🇴 +57</option>
          <option value="58">🇻🇪 +58</option>
          <option value="51">🇵🇪 +51</option>
          <option value="507">🇵🇦 +507</option>
          <option value="506">🇨🇷 +506</option>
          <option value="54">🇦🇷 +54</option>
          <option value="56">🇨🇱 +56</option>
          <option value="593">🇪🇨 +593</option>
          <option value="502">🇬🇹 +502</option>
          <option value="503">🇸🇻 +503</option>
          <option value="504">🇭🇳 +504</option>
          <option value="">Otro</option>
        </select>
        <input id="whatsapp-telefono" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="809 555 1234" aria-label="Número de WhatsApp" required>
      </div>
      <p class="acceso-error" id="whatsapp-error" role="alert"></p>
      <div class="dialogo-acciones">
        <button class="boton" value="luego" formnovalidate>Ahora no</button>
        <button class="boton boton-principal boton-guardar-whatsapp" value="guardar" id="whatsapp-guardar">Guardar mi WhatsApp</button>
      </div>
    </form>
  </dialog>


  <script src="js/ui.js?v=202610161628"></script>
  <script src="js/config.js?v=202610161628"></script>
  <script src="js/guion.js?v=202610161628"></script>
  <script src="js/diferencias.js?v=202610161628"></script>
  <script src="js/chat.js?v=202610161628"></script>
  <script src="js/vista.js?v=202610161628"></script>
  <script src="js/exportar.js?v=202610161628"></script>
  <script src="js/teleprompter.js?v=202610161628"></script>
  <script src="js/cliente.js?v=202610161628"></script>
</body>
</html>
